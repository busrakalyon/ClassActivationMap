[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-finer-research"
version = "0.1.0"
description = "Reproducible EdgeCAM baseline and later Finer-CAM/fusion research infrastructure"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.9,<5"]
dev = ["ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

